<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><title id="t">把日期排在一起看：台上提到的事件時間軸</title><desc id="d">2022 年 11 月 30 日 ChatGPT 推出；2026 年 6 月 24 日 OpenAI 與博通發表 Jalapeño；9 月 3 日 GPT-6 Astra 推出，台上說是 8 月；9 月 22 日加入 GPT-6 Sol 與 Luna；10 月 8 日 OpenAI 發布 Oracle 客戶案例；10 月 27 日 AI World 對談與合作公告；2026 年底 Jalapeño 預計啟動初期部署。</desc><rect width="1200" height="260" fill="#ffffff" rx="16"/><line x1="90" y1="120" x2="920" y2="120" stroke="#b8c0c8" stroke-width="3"/><line x1="920" y1="120" x2="1090" y2="120" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 6"/><path d="M150 108 l-8 24 M164 108 l-8 24" stroke="#57606a" stroke-width="2"/><circle cx="90" cy="120" r="9" fill="#1f2328"/><text x="90" y="50" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2022-11-30</text><text x="90" y="76" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">ChatGPT 推出</text><circle cx="260" cy="120" r="9" fill="#1f2328"/><text x="260" y="164" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026-06-24</text><text x="260" y="190" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">Jalapeño 發表</text><text x="260" y="90" font-size="16" fill="#57606a" font-weight="600" text-anchor="middle">OpenAI 與博通</text><circle cx="425" cy="120" r="9" fill="#c2412f"/><text x="425" y="50" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026-09-03</text><text x="425" y="76" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">GPT-6 Astra 推出</text><text x="425" y="164" font-size="16" fill="#c2412f" font-weight="600" text-anchor="middle">台上說：8 月</text><rect x="355" y="144" width="140" height="30" rx="8" fill="none" stroke="#c2412f" stroke-width="2" stroke-dasharray="5 4"/><circle cx="590" cy="120" r="9" fill="#1f2328"/><text x="590" y="164" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026-09-22</text><text x="590" y="190" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">GPT-6 Sol、Luna 加入</text><circle cx="755" cy="120" r="9" fill="#1f2328"/><text x="755" y="50" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026-10-08</text><text x="755" y="76" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">Oracle 客戶案例</text><circle cx="920" cy="120" r="9" fill="#c2412f"/><text x="920" y="164" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026-10-27</text><text x="920" y="190" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">AI World 對談</text><text x="920" y="90" font-size="16" fill="#57606a" font-weight="600" text-anchor="middle">合作公告</text><circle cx="1090" cy="120" r="9" fill="#ffffff" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><text x="1090" y="50" font-size="17" fill="#57606a" font-weight="600" text-anchor="middle">2026 年底</text><text x="1090" y="76" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">Jalapeño 初期部署</text><text x="1090" y="164" font-size="16" fill="#0f766e" font-weight="600" text-anchor="middle">預定目標</text></svg>