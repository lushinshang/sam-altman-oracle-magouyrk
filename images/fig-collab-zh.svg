<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 889" width="1200" height="889" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><title id="t">OpenAI 與 Oracle 的合作結構：台上談到的四條線</title><desc id="d">模型與 Oracle 內部使用、Codex 與 App Composer、OpenAI 模型與 AI Security Mesh、Jalapeño 晶片與 Oracle 雲端，四條合作線由 OpenAI 一側指向 Oracle 一側。</desc><rect width="1200" height="889" fill="#ffffff" rx="16"/><text x="270.0" y="50" font-size="26" fill="#1f2328" font-weight="700" text-anchor="middle">OpenAI</text><text x="930.0" y="50" font-size="26" fill="#1f2328" font-weight="700" text-anchor="middle">Oracle</text><rect x="40" y="80" width="460" height="174" rx="12" fill="#f3f6f9" stroke="#b8c0c8" stroke-width="2"/><text x="60" y="123" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">GPT-6</text><text x="60" y="152" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">採用「迄今最強勁」</text><text x="60" y="178" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">奧特曼自評 01:32</text><rect x="700" y="80" width="460" height="174" rx="12" fill="#f6f9f7" stroke="#b8c0c8" stroke-width="2"/><text x="720" y="123" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">Oracle 內部重度使用</text><text x="720" y="152" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">ChatGPT 桌面版推給所有人</text><text x="720" y="178" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">01:57</text><text x="720" y="205" font-size="19" fill="#c2412f" font-weight="600" text-anchor="start">超過 70% 軟體由 AI 寫</text><text x="720" y="231" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">僅台上說法 02:07</text><text x="600.0" y="153" font-size="18" fill="#57606a" font-weight="600" text-anchor="middle">模型與內部使用</text><line x1="514" y1="179" x2="672" y2="179" stroke="#1f2328" stroke-width="3"/><polygon points="686,179 670,170 670,188" fill="#1f2328"/><rect x="40" y="294" width="460" height="121" rx="12" fill="#f3f6f9" stroke="#b8c0c8" stroke-width="2"/><text x="60" y="337" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">Codex</text><text x="60" y="366" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">不寫程式的人也在做 app</text><text x="60" y="392" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">02:18</text><rect x="700" y="294" width="460" height="121" rx="12" fill="#f6f9f7" stroke="#b8c0c8" stroke-width="2"/><text x="720" y="337" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">App Composer</text><text x="720" y="366" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">安全、受控地部署這些 app</text><text x="720" y="392" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">02:36</text><text x="600.0" y="340" font-size="18" fill="#57606a" font-weight="600" text-anchor="middle">做 app</text><line x1="514" y1="366" x2="672" y2="366" stroke="#1f2328" stroke-width="3"/><polygon points="686,366 670,357 670,375" fill="#1f2328"/><rect x="40" y="455" width="460" height="121" rx="12" fill="#f3f6f9" stroke="#b8c0c8" stroke-width="2"/><text x="60" y="498" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">OpenAI 模型</text><text x="60" y="527" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">既能找漏洞、也能協助修復</text><text x="60" y="553" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">Magouyrk 所述 06:35</text><rect x="700" y="455" width="460" height="121" rx="12" fill="#f6f9f7" stroke="#b8c0c8" stroke-width="2"/><text x="720" y="498" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">AI Security Mesh</text><text x="720" y="527" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">兩家一起做</text><text x="720" y="553" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">06:42</text><text x="600.0" y="501" font-size="18" fill="#57606a" font-weight="600" text-anchor="middle">資安</text><line x1="514" y1="527" x2="672" y2="527" stroke="#1f2328" stroke-width="3"/><polygon points="686,527 670,518 670,536" fill="#1f2328"/><rect x="40" y="616" width="460" height="177" rx="12" fill="#f3f6f9" stroke="#b8c0c8" stroke-width="2"/><text x="60" y="659" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">Jalapeño 推論晶片</text><text x="60" y="688" font-size="19" fill="#c2412f" font-weight="600" text-anchor="start">奧特曼稱「世界上最好」</text><text x="60" y="714" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">09:37，OpenAI 與博通</text><rect x="700" y="616" width="460" height="177" rx="12" fill="#f6f9f7" stroke="#b8c0c8" stroke-width="2"/><text x="720" y="659" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">Oracle 雲端（OCI）</text><text x="720" y="688" font-size="19" fill="#c2412f" font-weight="600" text-anchor="start">奧特曼說「正在 OCI 上部署」</text><text x="720" y="714" font-size="17" fill="#57606a" font-weight="400" text-anchor="start">09:30</text><text x="720" y="741" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">Oracle 書面：計畫部署</text><text x="720" y="769" font-size="19" fill="#1f2328" font-weight="400" text-anchor="start">OpenAI 公告：預計 2026 年底前初期部署</text><text x="600.0" y="690" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">算力／晶片</text><line x1="514" y1="716" x2="672" y2="716" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 6"/><polygon points="686,716 670,707 670,725" fill="#0f766e"/><text x="600.0" y="833" font-size="17" fill="#57606a" font-weight="400" text-anchor="middle">紅字：僅台上說法，或與書面紀錄有差距</text><text x="600.0" y="859" font-size="17" fill="#57606a" font-weight="400" text-anchor="middle">虛線箭頭：計畫中，尚未完成</text></svg>